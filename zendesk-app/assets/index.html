<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Concept Review</title>
  <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 120px;
      gap: 12px;
      color: #6b7280;
      font-size: 13px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #e5e7eb;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #frame-wrapper {
      display: none;
      width: 100%;
    }

    iframe {
      width: 100%;
      border: none;
      display: block;
    }

    #error {
      display: none;
      padding: 16px;
      background: #fef2f2;
      color: #991b1b;
      font-size: 13px;
      border-radius: 8px;
      margin: 12px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span>Claude concept laden...</span>
  </div>
  <div id="frame-wrapper">
    <iframe id="review-frame" scrolling="yes"></iframe>
  </div>
  <div id="error">Kon het concept niet laden. Probeer het ticket te herladen.</div>

  <script>
    const client = ZAFClient.init();

    client.invoke('resize', { width: '100%', height: '600px' });

    client.get(['ticket.id', 'currentUser.id']).then(function(data) {
      const ticketId = data['ticket.id'];
      const agentId = data['currentUser.id'] || '';

      if (!ticketId) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        return;
      }

      const url = 'https://zendesk-review-production.up.railway.app/ticket/' + ticketId + '?agent_id=' + agentId;

      const frame = document.getElementById('review-frame');
      frame.src = url;
      frame.style.height = '580px';

      frame.onload = function() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('frame-wrapper').style.display = 'block';
      };

      frame.onerror = function() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      };

      // Fallback als iframe lang duurt
      setTimeout(function() {
        if (document.getElementById('loading').style.display !== 'none') {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('frame-wrapper').style.display = 'block';
        }
      }, 3000);
    });
  </script>
</body>
</html>
